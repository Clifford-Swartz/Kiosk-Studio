<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kiosk Studio</title>
    <style>
      /* Border-box everywhere: padding + borders count inside an element's
         width, so fixed-width panels don't overflow their column and clip
         their children's right edges. */
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html,
      body,
      #root {
        margin: 0;
        height: 100%;
        background: #000;
        overflow: hidden;
      }

      /* Sleek thin scrollbars for modern UI */
      * {
        scrollbar-width: thin;
        scrollbar-color: #374151 #0a0e13;
      }

      /* Webkit/Chromium scrollbar styling */
      *::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }

      *::-webkit-scrollbar-track {
        background: #0a0e13;
      }

      *::-webkit-scrollbar-thumb {
        background: #374151;
        border-radius: 4px;
      }

      *::-webkit-scrollbar-thumb:hover {
        background: #4b5563;
      }

      *::-webkit-scrollbar-thumb:active {
        background: #6b7280;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
